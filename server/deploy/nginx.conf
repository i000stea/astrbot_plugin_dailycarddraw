# Nginx 反向代理片段（宝塔面板 → 网站 → 选中站点 → 配置文件，或「反向代理」里粘贴）
#
# 设计要点：
#   1. 前端静态页和 API 同域，浏览器不需要处理跨域，登录 Cookie/Token 也简单；
#   2. Node 服务只监听 127.0.0.1:3100 对外不可见，所有外部流量都从这里进来；
#   3. AstrBot 容器不走 Nginx，直接打宿主机的 docker 网关 IP（见 server/README.md）。
#
# 把 your-domain.com 换掉，并把 root 指向 server/public。

server {
    listen 80;
    server_name your-domain.com;

    # 前端静态页（查询页 / 管理后台）直接由 Nginx 托管，比走 Express 更快
    root /www/wwwroot/astrbot_plugin_dailycarddraw/server/public;
    index index.html;

    access_log /www/wwwlogs/daily-carddraw.access.log;
    error_log  /www/wwwlogs/daily-carddraw.error.log;

    # 插件接口 + 管理后台接口
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /manage/api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    # 管理后台建议额外加一层访问限制（可选，二选一或都开）
    # location /admin {
    #     allow 203.0.113.10;   # 只允许你的固定出口 IP
    #     deny all;
    #     try_files $uri $uri.html /admin.html;
    # }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        expires 1h;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
